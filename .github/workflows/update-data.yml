name: 프랜차이즈 정보 자동 갱신

on:
  schedule:
    - cron: '0 17 * * *'  # 매일 새벽 2시 KST (UTC 17시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 브랜드 목록/매출통계 재수집 (연 1회성 데이터, 최신 연도로 갱신)
        run: |
          python scripts/fetch_brand_list.py
          python scripts/fetch_brand_stats.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 부담금 정보 점진 수집 (하루 할당량)
        run: python scripts/fetch_brand_fee.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 가맹본부 상세 점진 수집 (하루 할당량)
        run: python scripts/fetch_hq_detail.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 페이지용 데이터 재생성
        run: python scripts/process_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/ search_index.json
          git diff --cached --quiet || git commit -m "chore: 프랜차이즈 정보 자동 갱신 $(date +'%Y-%m-%d')"
          git push
